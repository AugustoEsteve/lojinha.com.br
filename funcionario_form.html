<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Funcionário</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            color: white;
            background: rgb(29, 29, 29);
        }

        .background {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-color: rgb(29, 29, 29);
            background-image: radial-gradient(circle 1.2px, rgba(173, 216, 230, 0.25) 100%, transparent 100%);
            background-size: 1rem 1rem;
        }

        header {
            width: 100%;
            position: fixed;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 2rem;
            backdrop-filter: blur(2px);
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(131, 152, 185, 0.254);
        }

        header nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }

        header nav a {
            color: white;
            text-decoration: none;
            background: rgb(131, 153, 185);
            padding: 0.6rem 1rem;
            border-radius: 0.7rem;
            transition: 0.3s ease;
        }

        header nav a:hover {
            transform: scale(1.03);
        }

        main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 1rem 2rem;
        }

        .container {
            width: min(32rem, 100%);
            background: rgba(43, 43, 43, 0.4);
            border-radius: 1.5rem;
            padding: 2rem;
            backdrop-filter: blur(3px);
        }

        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        input {
            width: 100%;
            padding: 0.8rem 0.75rem;
            border-radius: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: white;
            color: black;
            outline: none;
        }

        input:focus {
            border: 2px solid rgb(111, 111, 255);
        }

        button,
        .lista-funcionarios {
            display: inline-block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            background: rgb(111, 111, 255);
            color: white;
            border: none;
            border-radius: 0.8rem;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 0.5rem;
        }

        button:hover,
        .lista-funcionarios:hover {
            transform: scale(1.02);
            filter: brightness(1.05);
        }
    </style>
</head>

<body>
    <div class="background"></div>
    <header>
        <h1>Lojinha.com.br</h1>
        <nav>
            <a href="index.php">Página Inicial</a>
            <a href="db/prod-db/listar_produto.php">Produtos</a>
        </nav>
    </header>
    <main>
        <section class="container">
            <h1>Cadastro de Funcionários</h1>
            <form action="db/funcionarios-db/salvar_funcionario.php" method="POST">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu Nome" required>
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" placeholder="XXX.XXX.XXX-XX" required>
                <label for="cargo">Cargo:</label>
                <input type="text" id="cargo" name="cargo" placeholder="Digite seu Cargo" required>
                <label for="salario">Salário (R$):</label>
                <input type="number" id="salario" name="salario" step="0.01" min="0" placeholder="0.00" required>
                <button type="submit">Salvar Funcionário</button>
            </form>
            <a class="lista-funcionarios" href="db/funcionarios-db/listar_funcionario.php">Listar Funcionários</a>
        </section>
    </main>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<!-- head - Cabeça do website -->

<head>
    <!-- meta > UTF-8 - Aceitar formatação UTF-8 para não sair letras quebradas -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title - Título do website -->
    <title>Cliente_Form</title>
    <!-- style - CSS para estilizar o website -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            color: white;
        }

        .background {
            position: fixed;
            inset: 0;
            z-index: -1;
            width: 100%;
            height: 100%;
            background-color: rgb(29, 29, 29);
            background-image:
                radial-gradient(circle 1.2px, rgba(173, 216, 230, 0.25) 100%, transparent 100%);
            background-size: 1rem 1rem;
        }

        .background::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image:
                radial-gradient(circle at center, transparent 60%, rgb(29, 29, 29) 100%);
            pointer-events: none;
        }

        header {
            width: 100%;
            z-index: 1;
            position: fixed;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 2rem;
            backdrop-filter: blur(2px);
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(131, 152, 185, 0.254);
        }

        header nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }

        header nav a {
            color: white;
            text-decoration: none;
            background: rgb(131, 153, 185);
            padding: 0.5rem 1rem;
            border-radius: 0.7rem;
            transition: 0.6s ease all;
        }

        header nav a:hover {
            transform: scale(1.05);
        }

        header nav .active {
            background: rgb(111, 111, 255);
            transform: scale(1.05);
        }

        .inicio {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .inicio .container {
            position: relative;
            top: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(2px);
            padding: 2rem;
            border-radius: 1rem;
        }

        .inicio .container h1 {
            margin-bottom: 1rem;
        }

        .inicio .container form {
            width: 100%;
            flex: 1 1;
            display: flex;
            justify-content: center;
            align-items: start;
            flex-direction: column;
        }

        .inicio .container form input {
            width: 100%;
            padding: 0.35rem;
            border-radius: 0.4rem;
            border: none;
            outline: none;
            transition: 0.2s ease all;
        }

        .inicio .container form input:focus {
            outline: 2px solid rgb(111, 111, 255);
        }

        .inicio .container form button {
            width: 100%;
            padding: 0.4rem;
        }
    </style>
</head>

<body>
    <!-- div > background - Apenas estilizar o fundo melhor -->
    <div class="background"></div>

    <!-- header - Parte superior do website -->
    <header>
        <!-- h1 - Título da header -->
        <h1>Lojinha.com.br</h1>

        <!-- nav - Navbar, navegar entre páginas -->
        <nav>
            <a href="index.php">Página Inicial</a>
            <a href="db/prod-db/listar_produto.php">Produtos</a>
        </nav>
    </header>

    <main>
        <section class="inicio">
            <div class="container">
                <!-- h1 - Título da página -->
                <h1>Cadastro de Cliente</h1>
                <!-- form - Formulário com método POST para salvar_cliente.php -->
                <form action="db/client-db/salvar_cliente.php" method="post">
                    <!-- label - Especificar o que é cada coisa para escrever formulário -->
                    <label>Nome:</label>
                    <!-- input - Campo de digitação -->
                    <input type="text" name="nome" placeholder="João Gabriel Braga" required>
                    
                    <br>

                    <label>CPF:</label>
                    <input type="text" name="cpf" placeholder="XXX.XXX.XXX-XX" required>
                    
                    <br>

                    <label>Crédito:</label>
                    <input type="number" step="0.01" name="credito" placeholder="100">
                    
                    <br>

                    <label>Saldo:</label>
                    <input type="number" step="0.01" name="saldo" placeholder="100">
                    
                    <br>

                    <!-- button > submit - Fazer o POST do formulário e enviar informações digitadas -->
                    <button type="submit">Cadastrar Cliente</button>
                </form>
            </div>
        </section>
    </main>
</body>

</html>

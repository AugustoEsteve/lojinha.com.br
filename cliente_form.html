<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            color: white;
        }

        .background {
            position: fixed;
            inset: 0;
            z-index: -1;
            width: 100%;
            height: 100%;
            background-color: rgb(29, 29, 29);
            background-image: radial-gradient(circle 1.2px, rgba(173, 216, 230, 0.25) 100%, transparent 100%);
            background-size: 1rem 1rem;
        }

        .background::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: radial-gradient(circle at center, transparent 60%, rgb(29, 29, 29) 100%);
            pointer-events: none;
        }

        header {
            width: 100%;
            position: fixed;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 2rem;
            backdrop-filter: blur(2px);
            border-bottom: 1px solid rgba(131, 152, 185, 0.254);
            flex-wrap: wrap;
        }

        header nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }

        header nav a {
            text-decoration: none;
            color: white;
            background: rgb(131, 153, 185);
            padding: 0.6rem 1rem;
            border-radius: 0.75rem;
            transition: 0.3s ease;
        }

        header nav a:hover {
            transform: scale(1.03);
        }

        main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 1rem 2rem;
        }

        .container {
            width: min(32rem, 100%);
            background: rgba(43, 43, 43, 0.4);
            border-radius: 1.5rem;
            padding: 2rem;
            backdrop-filter: blur(3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
        }

        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        label {
            font-weight: 600;
            color: #eaeaea;
        }

        input {
            width: 100%;
            padding: 0.8rem 0.75rem;
            border-radius: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: white;
            color: black;
            outline: none;
        }

        input:focus {
            border: 2px solid rgb(111, 111, 255);
        }

        button {
            margin-top: 0.5rem;
            background: rgb(111, 111, 255);
            color: white;
            border: none;
            border-radius: 0.8rem;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            transform: scale(1.02);
            filter: brightness(1.05);
        }

        @media (max-width: 500px) {
            .container {
                padding: 1.4rem;
            }
        }
    </style>
</head>

<body>
    <div class="background"></div>

    <header>
        <h1>Lojinha.com.br</h1>
        <nav>
            <a href="index.php">Página Inicial</a>
            <a href="db/prod-db/listar_produto.php">Produtos</a>
        </nav>
    </header>

    <main>
        <section class="container">
            <h1>Cadastro de Cliente</h1>
            <form action="db/client-db/salvar_cliente.php" method="post">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="João Gabriel Braga" required>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" placeholder="XXX.XXX.XXX-XX" required>

                <label for="credito">Crédito:</label>
                <input type="number" id="credito" step="0.01" name="credito" placeholder="100">

                <label for="saldo">Saldo:</label>
                <input type="number" id="saldo" step="0.01" name="saldo" placeholder="100">

                <button type="submit">Cadastrar Cliente</button>
            </form>
        </section>
    </main>
</body>

</html>
